<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายละเอียดเกม</title>
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="brand-name"><b>INBLACK</b><small>DEALS</small></span></a>
  <nav aria-label="หลัก"><a href="./">5 เกม</a><a href="evidence.html">หลักฐาน</a></nav>
</div></header>
<main class="wrap"><p class="muted">กำลังโหลด…</p></main>
<footer><div class="wrap">ลิงก์ร้านทั้งหมดผ่าน CheapShark (redirect) · ราคาบาท = ราคา USD × อัตราแลกเปลี่ยนจาก Frankfurter (ใช้แสดงผลเท่านั้น ไม่มีผลกับคะแนน)</div></footer>
<script src="assets/common.js?v=2"></script>
<script>
const FACTORS = [
  ['F1', 'ส่วนลดจากราคาปกติ', 40, (g) => `40 × ${g.inputs.savings.value} / 100`, (g) => [g.inputs.savings]],
  ['F2', 'ใกล้ราคาต่ำสุดที่เคยมี', 35, (g) => `35 × min(1, ${g.inputs.cheapestEver.value} / ${g.inputs.price.value})`, (g) => [g.inputs.cheapestEver, g.inputs.price]],
  ['F3', 'คะแนนรีวิว Steam', 25, (g) => `25 × ${g.inputs.rating.value} / 100`, (g) => [g.inputs.rating]],
];

// Price line chart (THB) as in the brief's mockup: a red line through the lowest price of each collected day, with
// faint reference lines for the regular price and the all-time low. The SVG only draws lines (it stretches to the card
// width; strokes and dots keep their size via vector-effect); dates and prices are HTML below, so they stay readable.
function chart(g) {
  const fin = (v) => v !== null && v !== undefined && v !== '' && Number.isFinite(Number(v));
  const pts = g.history.filter((h) => !h.missing && fin(h.priceTHB));
  const refs = [[g.retailTHB, 'line-ref'], [g.cheapestEverTHB, 'line-low']].filter(([v]) => fin(v));
  const vals = pts.map((h) => Number(h.priceTHB)).concat(refs.map(([v]) => Number(v)));
  if (!vals.length) return '<p class="muted small">ไม่มีข้อมูลราคาสำหรับกราฟ</p>';
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo;
  const PAD = 6;
  const x = (i) => (pts.length === 1 ? 50 : PAD + (i * (100 - 2 * PAD)) / (pts.length - 1));
  const y = (v) => (span ? 4 + (1 - (Number(v) - lo) / span) * 32 : 20).toFixed(2); // flat data sits mid-height
  const ref = ([v, cls]) => `<line class="${cls}" x1="0" x2="100" y1="${y(v)}" y2="${y(v)}" vector-effect="non-scaling-stroke"/>`;
  const line = pts.map((h, i) => `${x(i).toFixed(2)},${y(h.priceTHB)}`).join(' ');
  const dots = pts.map((h, i) => `<path class="line-dot" d="M${x(i).toFixed(2)} ${y(h.priceTHB)} l0 0" vector-effect="non-scaling-stroke"><title>${esc(h.day)}: ${thb(h.priceTHB)} บาท (${usd(h.price)})</title></path>`).join('');
  // labels are positioned at the same x as their dot (end labels anchored to their edge so they never overflow)
  const pos = (i) => (pts.length === 1 ? 'left:50%;transform:translateX(-50%);text-align:center'
    : i === 0 ? `left:${x(i).toFixed(2)}%` : i === pts.length - 1 ? `right:${(100 - x(i)).toFixed(2)}%;text-align:right`
      : `left:${x(i).toFixed(2)}%;transform:translateX(-50%);text-align:center`);
  return `<div class="line-chart" role="img" aria-label="กราฟเส้นราคาต่ำสุดเป็นบาทของแต่ละวันที่เก็บข้อมูล">
    <svg class="line-svg" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
      ${refs.map(ref).join('')}
      ${pts.length > 1 ? `<polyline class="line-main" points="${line}" vector-effect="non-scaling-stroke"/>` : ''}${dots}
    </svg>
    <div class="line-labels">${pts.map((h, i) => `<span style="${pos(i)}">${esc(h.day)}<br><strong>${thb(h.priceTHB)}</strong> บาท<br>${usd(h.price)}</span>`).join('')}</div>
  </div>`;
}

loadData().then((d) => {
  const id = new URLSearchParams(location.search).get('id');
  const g = d.games.find((x) => x.game_id === id);
  if (!g) throw new Error(`ไม่พบเกม id=${id || '(ไม่ได้ระบุ)'} · เลือกเกมจากหน้าแรก`);
  document.title = `${g.title} — ${VERDICT_TH[g.verdict]}`;
  const stores = g.stores.slice().sort((a, b) => a.price - b.price);
  const claims = g.claims || [];
  document.querySelector('main').innerHTML = `
    <p class="small"><a href="./">← 5 เกม</a></p>
    <h1>${esc(g.title)}</h1>
    <p class="muted">ข้อมูลรอบ ${esc(d.latest_day)} · อัปเดต ${esc(thaiTime(d.updated_at))} · CheapShark gameID ${esc(g.game_id)}</p>
    <div class="card"><div class="row"><div>แนะนำ ${badge(g.verdict)}</div><div class="score" style="font-size:1.6rem">${g.score}/100</div></div>
      ${g.summary_th ? `<p>${esc(g.summary_th)}</p>` : ''}</div>

    <h2>คะแนน</h2>
    <div class="table-scroll"><table>
      <tr><th>ปัจจัย</th><th class="num">คะแนน</th><th>สูตร</th><th>หลักฐาน</th></tr>
      ${FACTORS.map(([k, name, max, f, ins]) => `<tr><td>${name}</td><td class="num"><span class="score">${g.factors[k]}</span>/${max}</td>
        <td><code>${esc(f(g))}</code></td><td>${ins(g).map(src).join('<br>')}</td></tr>`).join('')}
      <tr><td><strong>รวม</strong></td><td class="num"><strong>${g.score}</strong>/100</td><td colspan="2" class="small muted">≥ ${d.formula.thresholds.buy} ซื้อ · ≥ ${d.formula.thresholds.wait} รอ · ต่ำกว่านั้นไม่ซื้อ</td></tr>
    </table></div>

    <h2>กราฟราคา (บาท)</h2>
    <div class="card">${chart(g)}
      <p class="small muted">เส้นแดง = ราคาต่ำสุดของแต่ละวันที่เก็บข้อมูล (${g.history.filter((h) => !h.missing).length} จาก ${g.history.length} วัน แปลงเป็นบาทด้วยอัตราของรอบวันนั้น) ·
        เส้นประเทา = ราคาปกติ ${thb(g.retailTHB)} บาท · เส้นประเขียว = ราคาต่ำสุดที่ CheapShark เคยบันทึก ${thb(g.cheapestEverTHB)} บาท (อัตรารอบล่าสุด)</p>
      ${(() => { const p = g.history.filter((h) => !h.missing); return p.length > 1 && p.every((h) => Number(h.price) === Number(p[0].price)) && p.some((h) => h.priceTHB !== p[0].priceTHB)
    ? `<p class="small note">ราคาดอลลาร์เท่าเดิมทุกวัน (${usd(p[0].price)}) — ราคาบาทที่ขยับเกิดจากอัตราแลกเปลี่ยนเท่านั้น (${p.map((h) => `${esc(h.day)}: ${esc(h.fx)}`).join(' → ')} บาท/USD)</p>` : ''; })()}
      <p class="small">หลักฐาน: ${g.history.filter((h) => !h.missing).map((h) => `${esc(h.day)} ราคา ${src(h.source)} อัตรา ${src(h.fxSource)}`).join(' · ')} · ต่ำสุดที่เคยมี ${src(g.inputs.cheapestEver)}</p></div>

    <h2>ราคาแต่ละร้าน (บาท)</h2>
    <p class="small muted">1 USD = ${esc(g.inputs.fx.value)} บาท (อัตราของวันที่ ${esc(g.fxDate)}) ${src(g.inputs.fx)}</p>
    <div class="table-scroll"><table>
      <tr><th>ร้าน</th><th class="num">ราคา (บาท)</th><th class="num">USD</th><th class="num">ราคาปกติ USD</th><th class="num">ลด</th><th>ซื้อ</th></tr>
      ${stores.map((s) => `<tr><td>${esc(s.storeName)}${s.storeActive ? '' : ' <span class="bad small">(ร้านปิด)</span>'}<br>${src(s.source)}</td>
        <td class="num"><strong>${thb(s.thb)}</strong></td><td class="num">${usd(s.price)}</td><td class="num">${usd(s.retailPrice)}</td>
        <td class="num">${esc(s.savings)}%</td><td><a href="${esc(s.link)}" rel="nofollow noopener" target="_blank">ไปที่ร้าน (CheapShark)</a></td></tr>`).join('')}
    </table></div>

    <h2>เหตุผลและหลักฐาน</h2>
    <div class="table-scroll"><table>
      <tr><th>ข้ออ้าง</th><th class="num">ค่า</th><th>ไฟล์ + pointer</th><th>ตรวจ</th></tr>
      ${claims.map((c) => `<tr><td>${esc(c.statement_th)}</td><td class="num">${esc(c.value)}</td><td>${src(c.source)}</td>
        <td>${c.ok ? '<span class="ok">ตรง</span>' : `<span class="bad">ไม่ตรง</span> ${esc(c.reason)}`}</td></tr>`).join('')}
    </table></div>
    ${g.problems.length ? `<h2>ข้อมูลที่มีปัญหา</h2><ul>${g.problems.map((p) => `<li><strong>${esc(p.kind)}</strong>: ${esc(p.detail)}<br>${src(p)}</li>`).join('')}</ul>` : ''}
  `;
}).catch(fail);
</script>
</body>
</html>
