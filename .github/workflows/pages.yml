# Test, verify every claim against data/raw/, build site data from raw files, deploy GitHub Pages.
# No API calls here (raw data is collected locally once per day and committed). Uses only the built-in token.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run verify

      - name: Secret scan (tracked files, names only)
        run: |
          P='gh''p_[A-Za-z0-9]{20,}|github''_pat_[A-Za-z0-9_]{20,}|s''k-[A-Za-z0-9_-]{20,}|AK''IA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIV''ATE KEY'
          if git grep -lIE "$P" -- .; then echo "::error::possible secret in the file(s) above"; exit 1; fi
          echo "secret scan: clean"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          rm -rf _site/data
          node scripts/build-site-data.js --out _site/data/site-data.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
